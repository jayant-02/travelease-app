<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - TravelEase</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/bookings.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.png" alt="TravelEase" style="height:32px;width:32px;border-radius:8px;object-fit:cover;"> TravelEase
      </a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="index.html#how-it-works"><i class="fas fa-info-circle"></i> How It Works</a></li>
        <li><a href="#footer"><i class="fas fa-envelope"></i> Contact</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
        <div class="nav-actions" id="navActions">
          <!-- Auth/User Menu yahan show hoga JS se -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Bookings container -->
  <div class="bookings-container">
    <h2>My Bookings</h2>
    
    <!-- Stats cards -->
    <div class="booking-stats">
      <div class="stat-card">
        <h4>Total Trips</h4>
        <p id="statTotalTrips">0</p>
      </div>
      <div class="stat-card">
        <h4>Total Spent</h4>
        <p id="statTotalSpent">₹0</p>
      </div>
      <div class="stat-card">
        <h4>Favourite City</h4>
        <p id="statFavCity">-</p>
      </div>
    </div>
    
    <!-- Tickets list -->
    <h3>Your Tickets</h3>
    <div id="bookingsList" class="bookings-list">
      <!-- Tickets loaded by JS -->
    </div>
    
    <!-- Cab Bookings list -->
    <h3>Your Cab Bookings</h3>
    <div id="cabBookingsList" class="cab-bookings-list">
      <!-- Cab bookings loaded by JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer id="footer" class="footer">
    <div class="footer-grid">
      <div class="footer-brand">
        <h3>TravelEase</h3>
        <p>India's Smartest Travel Platform</p>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 TravelEase. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/bookings.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080/api';
  </script>
</body>
</html>
