<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Cab - TravelEase</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cab-booking.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.png" alt="TravelEase" style="height:32px;width:32px;border-radius:8px;object-fit:cover;"> TravelEase
      </a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="nav-actions" id="navActions"></div>
      </div>
    </div>
  </nav>

  <!-- Cab Booking Container -->
  <div class="cab-booking-container">
    <div class="cab-header text-center">
      <h2>Book a Cab</h2>
      <p>Comfortable rides to your final destination</p>
    </div>
    
    <div class="cab-form card">
      <div class="input-group">
        <label>Pickup Location</label>
        <input type="text" id="pickupInput" placeholder="Enter pickup address" required>
      </div>
      
      <div class="input-group">
        <label>Dropoff Location</label>
        <input type="text" id="dropoffInput" placeholder="Enter dropoff address" required>
      </div>
      
      <label>Select Cab Type</label>
      <div class="cab-type-selector">
        <label class="cab-card">
          <input type="radio" name="cabType" value="Mini" data-rate="8" checked>
          <div class="cab-card-inner">
            <i class="fas fa-car"></i>
            <h4>Mini</h4>
            <p>₹8/km</p>
          </div>
        </label>
        
        <label class="cab-card">
          <input type="radio" name="cabType" value="Sedan" data-rate="12">
          <div class="cab-card-inner">
            <i class="fas fa-car-side"></i>
            <h4>Sedan</h4>
            <p>₹12/km</p>
          </div>
        </label>
        
        <label class="cab-card">
          <input type="radio" name="cabType" value="SUV" data-rate="16">
          <div class="cab-card-inner">
            <i class="fas fa-shuttle-van"></i>
            <h4>SUV</h4>
            <p>₹16/km</p>
          </div>
        </label>
      </div>
      
      <div class="fare-estimate">
        Estimated Fare: <span id="estimatedFareText">₹0</span>
      </div>
      
      <button class="btn-primary w-100" id="btnConfirmCab">Confirm Cab Booking</button>
    </div>
  </div>

  <footer id="footer" class="footer">
    <div class="footer-bottom text-center">
      <p>&copy; 2026 TravelEase. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cab-booking.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080/api';
  </script>
</body>
</html>
